<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Zoo Management System{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem; border-bottom: 1px solid #8888; padding-bottom: 0.5rem; margin-bottom: 1rem; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #8888; padding: 0.4rem 0.6rem; text-align: left; }
    ul.flash-messages { list-style: none; padding: 0; }
    .flash { padding: 0.6rem 0.8rem; border-radius: 0.3rem; margin-bottom: 0.5rem; }
    .flash-success { background: #1e7e34; color: #fff; }
    .flash-error { background: #a83232; color: #fff; }
    .flash-info { background: #3468a8; color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>🦁 Zoo Management System</h1>
    <nav>
      <a href="{{ url_for('zoo.index') }}">Dashboard</a>
      <a href="{{ url_for('zoo.list_animals') }}">Tiere</a>
      <a href="{{ url_for('zoo.financial_report') }}">Finanzbericht</a>
    </nav>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flash-messages">
        {% for category, message in messages %}
          <li class="flash flash-{{ category }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
